name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pha
          POSTGRES_PASSWORD: pha
          POSTGRES_DB: pha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check migrations match the schema
        run: npx drizzle-kit generate --name ci-drift && test -z "$(git status --porcelain -- drizzle)"
      - name: Test (PGlite)
        run: npm test
      - name: Test (Postgres 16)
        run: npx vitest run --no-file-parallelism src/db src/server
        env:
          TEST_DATABASE_URL: postgres://pha:pha@localhost:5432/pha
      - run: npm run build
