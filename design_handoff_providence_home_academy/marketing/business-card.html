<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:#7B2D26;text-decoration:none}
  a:hover{color:#5E211C}
</style>
</helmet>
<div style="min-height:100vh;box-sizing:border-box;background:#E5DAC4;padding:40px 24px;display:flex;align-items:center;justify-content:center;font-family:'Libre Franklin',sans-serif">
  <div style="width:100%;max-width:1040px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:32px">

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#5E5648">Front</div>
      <div data-screen-label="Front" style="container-type:inline-size;aspect-ratio:3.5/2;box-shadow:0 1px 2px rgba(31,27,21,.18),0 8px 24px rgba(31,27,21,.12)">
        <div style="height:100%;box-sizing:border-box;background:#1F1B15;color:#EFE7D7;padding:5.7cqw 6.3cqw;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;gap:2.4cqw">
            <svg style="width:5.2cqw;height:5.9cqw" viewBox="0 0 30 34" fill="none"><path d="M1 1h28v19.5C29 27 22.5 31 15 33 7.5 31 1 27 1 20.5V1Z" stroke="#A87C3D" stroke-width="1.8"></path><path d="M15 6v20M6 16h18" stroke="#A87C3D" stroke-width="1.4"></path></svg>
            <span style="font-family:'EB Garamond',serif;font-size:3cqw;letter-spacing:.18em;text-transform:uppercase;color:#A87C3D">Providence Home Academy</span>
          </div>
          <div style="margin-top:auto;font-family:'EB Garamond',serif;font-weight:500;font-size:6.75cqw;line-height:1.08;letter-spacing:-.005em;text-wrap:pretty">A classical education, taught at home.</div>
          <div style="margin-top:3.2cqw;border-top:1px solid rgba(233,222,198,.22);padding-top:2cqw;display:flex;justify-content:space-between;font-size:2.6cqw;letter-spacing:.14em;text-transform:uppercase;color:#BFB49E">
            <span>Kindergarten – Grade 12</span>
            <span>Families &amp; parishes</span>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#5E5648">Back</div>
      <div data-screen-label="Back" style="container-type:inline-size;aspect-ratio:3.5/2;box-shadow:0 1px 2px rgba(31,27,21,.18),0 8px 24px rgba(31,27,21,.12)">
        <div style="height:100%;box-sizing:border-box;background:#EFE7D7;color:#1F1B15;padding:5.7cqw 6.3cqw;display:flex;flex-direction:column">
          <div style="font-family:'EB Garamond',serif;font-size:6cqw;line-height:1.1">Josh Bennett</div>
          <div style="font-size:2.6cqw;letter-spacing:.16em;text-transform:uppercase;color:#A87C3D;margin-top:1.2cqw">Founder</div>
          <div style="margin-top:auto;display:flex;flex-direction:column;gap:1cqw;font-size:3cqw;line-height:1.35;color:#3E382E">
            <span>josh@joshwbennett.com</span>
            <span>678-544-7328</span>
          </div>
          <div style="margin-top:2.4cqw;border-top:1px solid #CFC1A4;padding-top:2cqw;display:flex;justify-content:space-between;align-items:center">
            <span style="font-family:'EB Garamond',serif;font-size:4cqw;color:#7B2D26">providence-home.academy</span>
            <svg style="width:3.6cqw;height:4cqw" viewBox="0 0 30 34" fill="none"><path d="M1 1h28v19.5C29 27 22.5 31 15 33 7.5 31 1 27 1 20.5V1Z" stroke="#A87C3D" stroke-width="2"></path><path d="M15 6v20M6 16h18" stroke="#A87C3D" stroke-width="1.6"></path></svg>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
